load_url:
  name: Load URL
  description: Queue a command for a kiosk device to load a specific URL.
  fields:
    device_id:
      name: Device ID
      description: Kiosk device identifier configured in this integration.
      required: true
      selector:
        text:
    url:
      name: URL
      description: Absolute URL to load on the kiosk.
      required: true
      selector:
        text:

load_start_url:
  name: Load Start URL
  description: Queue a command for a kiosk device to load its configured start URL.
  fields:
    device_id:
      name: Device ID
      description: Kiosk device identifier configured in this integration.
      required: true
      selector:
        text:

start_application:
  name: Start Application
  description: Queue an Android start_application command for the kiosk.
  fields:
    device_id:
      name: Device ID
      description: Kiosk device identifier configured in this integration.
      required: true
      selector:
        text:
    app_intent:
      name: App Intent URI
      description: Full Android intent URI (preferred when available).
      required: false
      selector:
        text:
    package_name:
      name: Package Name
      description: Android package name used as a fallback intent target.
      required: false
      selector:
        text:
    deep_link_url:
      name: Deep Link URL
      description: Android deep link URL fallback.
      required: false
      selector:
        text:
